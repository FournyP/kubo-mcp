name: Release Images

on:
  # Called by release.yml: tags pushed with GITHUB_TOKEN trigger no workflow.
  workflow_call:
    inputs:
      tag:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to also publish as semver (e.g. v1.2.3)"
        type: string
        default: ""

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/kubo-mcp
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=sha

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/kubo_mcp_host/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          build-args: |
            VERSION=${{ inputs.tag || github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=kubo-mcp
          cache-to: type=gha,mode=max,scope=kubo-mcp

      - name: Write digest to summary
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/kubo-mcp
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### ${IMAGE}"
            echo
            echo "- Digest: \`${IMAGE}@${DIGEST}\`"
            echo "- Tags:"
            echo "${TAGS}" | sed 's/^/  - `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
