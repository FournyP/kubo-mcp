name: Docker Build

on:
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "src/kubo_mcp_host/Dockerfile"
      - "src/kubo_mcp_host/Dockerfile.dockerignore"
      - ".github/workflows/docker-build.yml"

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/kubo_mcp_host/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
