name: Go Build

on:
  push:
    branches:
      - main
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/go-build.yml"
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/go-build.yml"
  workflow_call:

concurrency:
  group: go-build-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  go-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: false

      # Sole writer of the Go cache: parallel jobs saving the same key race and waste the upload.
      - name: Cache Go modules and build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-1.27.3-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.27.3-

      - name: Build
        run: go build ./...
